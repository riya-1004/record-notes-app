{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Record{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'notes/css/style.css' %}">
</head>
<body>

<!-- Top navigation bar -->
<nav class="quicknote-nav">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="{% url 'home' %}" class="brand-link">
            <span class="brand-name">RECORDS</span>
        </a>

        <div class="d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <span class="nav-username">Hi, {{ user.username }}</span>
                <form method="POST" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm">Login</a>
                <a href="{% url 'signup' %}" class="btn btn-primary btn-sm">Sign up</a>
            {% endif %}

            <!-- Light / Dark mode toggle -->
            <button id="theme-toggle" type="button" class="theme-toggle-btn" title="Toggle light / dark mode">
                <span id="theme-icon">🌙</span>
            </button>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script>
    // Light / dark mode toggle — very simple version.
    // We just add/remove a "dark-mode" class on <body> and
    // remember the choice in localStorage.

    var toggleBtn = document.getElementById('theme-toggle');
    var themeIcon = document.getElementById('theme-icon');

    function setDarkMode(isDark) {
        if (isDark) {
            document.body.classList.add('dark-mode');
            themeIcon.textContent = '☀️';
        } else {
            document.body.classList.remove('dark-mode');
            themeIcon.textContent = '🌙';
        }
    }

    // On page load, use whatever the user picked last time (default: light)
    var savedPreference = localStorage.getItem('record-dark-mode');
    setDarkMode(savedPreference === 'true');

    if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
            var isCurrentlyDark = document.body.classList.contains('dark-mode');
            var willBeDark = !isCurrentlyDark;
            setDarkMode(willBeDark);
            localStorage.setItem('record-dark-mode', willBeDark);
        });
    }
</script>
</body>
</html>
